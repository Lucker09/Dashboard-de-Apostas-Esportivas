server.port=8080

spring.application.name=bets-dashboard

# Carrega variáveis de um arquivo .env na pasta de execução (opcional, NÃO versionado).
spring.config.import=optional:file:.env[.properties]

# Configuração da Base de Dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bets_dashboard?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (Com valor padrão de fallback com mais de 32 caracteres)
jwt.secret=${JWT_SECRET:minha_chave_secreta_super_segura_com_pelo_menos_32_caracteres_aqui}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: origens do frontend, separadas por vírgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}